name: frontend

on:
  # 只有发布 v* tag 才构建 / 推送镜像；普通 push 到 main 不触发。
  push:
    tags: ["v*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Typecheck & build
        run: pnpm build

  # Docker 生产交付：Caddy 镜像内含静态产物与 Caddyfile。
  image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # arm64 在 amd64 runner 上通过 QEMU 构建；GHCR 存多架构清单。
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # GHCR 镜像名必须全小写；github.repository 会保留仓库名大小写。
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_ENV"
      # v* tag：sha + 1.0.0 + 1.0 + latest（预发布 tag 不更新 latest）。
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          # 关闭 semver 自动附加 latest，由下方 raw tag 显式控制。
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 把 GHCR 的多架构镜像拆成单架构 tar.gz，附到同名 GitHub Release，供离线部署。
  release-assets:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Compute image name and version
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 只拉取目标架构，不运行，因此无需 QEMU；sha-* tag 一定存在，避免 semver 解析差异。
      - name: Pull ${{ matrix.arch }} image
        run: |
          docker pull --platform linux/${{ matrix.arch }} "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag "$IMAGE_NAME:sha-$GITHUB_SHA" "$IMAGE_NAME:$VERSION"
      - name: Export tar.gz
        run: |
          docker save "$IMAGE_NAME:$VERSION" \
            | gzip -9 > "frontend-$VERSION-linux-${{ matrix.arch }}.tar.gz"
      # 同一个 Release 由两个 workflow 共同追加文件；已存在时直接追加。
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-assets 没有 checkout，必须显式指定仓库。
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$repo" --title "$tag" --generate-notes --verify-tag \
            || gh release view "$tag" --repo "$repo" >/dev/null
          gh release upload "$tag" "frontend-$VERSION-linux-${{ matrix.arch }}.tar.gz" --repo "$repo" --clobber
