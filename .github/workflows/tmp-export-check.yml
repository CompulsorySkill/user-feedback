name: tmp-export-check

# 临时校验：确认 skopeo 导出的是 docker-archive（旧版 docker load 可读）且架构正确。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export arm64 via skopeo
        run: |
          skopeo --version
          image="ghcr.io/${GITHUB_REPOSITORY,,}/frontend:1.0.3"
          tar_file="frontend-check-arm64.tar"
          skopeo copy --override-os linux --override-arch arm64 \
            --authfile "$HOME/.docker/config.json" \
            "docker://$image" "docker-archive:$tar_file:ref=$image"
          echo "--- tar entries ---"
          tar -tf "$tar_file" | head -5
          echo "--- manifest.json ---"
          tar -xOf "$tar_file" manifest.json | head -c 400
          echo
          tar -xOf "$tar_file" manifest.json \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print('RepoTags:', m[0]['RepoTags'])"
          echo "--- inspected architecture ---"
          skopeo inspect --override-os linux --override-arch arm64 \
            --authfile "$HOME/.docker/config.json" "docker://$image" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Architecture:', d['Architecture'], 'Os:', d['Os'])"
