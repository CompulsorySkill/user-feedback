name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Alembic upgrade on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Pytest (SQLite)
        run: uv run pytest -q

  # Docker 部署按计划延后；镜像构建在启用 Docker/Nginx 阶段打开。
  image:
    needs: test
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
