name: backend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Alembic upgrade on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Alembic model/schema check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic check

      - name: Pytest (SQLite)
        run: uv run pytest -q

      - name: Validate Docker Compose config
        working-directory: ${{ github.workspace }}/deploy
        run: |
          cp .env.production.example .env
          docker compose config --quiet

  # Docker 生产交付：构建并推送 GHCR；目标机通过 deploy/docker-compose.yml 拉取。
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # GHCR 镜像名必须全小写；github.repository 会保留仓库名大小写。
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      # main：sha + latest；v* tag：sha + 1.0.0 + 1.0（不覆盖 latest）。
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
