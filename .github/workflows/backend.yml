name: backend

on:
  # 只有发布 v* tag 才构建 / 推送镜像；普通 push 到 main 不触发。
  push:
    tags: ["v*"]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Alembic upgrade on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Alembic model/schema check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic check

      - name: Pytest (SQLite)
        run: uv run pytest -q

      - name: Validate Docker Compose config
        working-directory: ${{ github.workspace }}/deploy
        run: |
          cp .env.example .env
          docker compose config --quiet

  # Docker 生产交付：构建并推送 GHCR；目标机通过 deploy/docker-compose.yml 拉取。
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # arm64 在 amd64 runner 上通过 QEMU 构建；GHCR 存多架构清单。
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # GHCR 镜像名必须全小写；github.repository 会保留仓库名大小写。
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      # v* tag：sha + 1.0.0 + 1.0 + latest（预发布 tag 不更新 latest）。
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          # 关闭 semver 自动附加 latest，由下方 raw tag 显式控制。
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 把 GHCR 的多架构镜像拆成单架构 tar.gz，附到同名 GitHub Release，供离线部署。
  release-assets:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Compute image name and version
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # skopeo 直接从 registry 取目标架构并写成 docker-archive 格式（旧版 docker load 也能读，
      # docker save 在新版 Docker 上输出的是 OCI 布局）。sha-* tag 一定存在，不依赖 semver 解析。
      - name: Export tar.gz
        run: |
          tar="backend-$VERSION-linux-${{ matrix.arch }}.tar"
          skopeo copy \
            --override-os linux --override-arch "${{ matrix.arch }}" \
            --authfile "$HOME/.docker/config.json" \
            "docker://$IMAGE_NAME:sha-$GITHUB_SHA" \
            "docker-archive:$tar:$IMAGE_NAME:$VERSION"
          gzip -9 "$tar"
      # 同一个 Release 由两个 workflow 共同追加文件；已存在时直接追加。
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-assets 没有 checkout，必须显式指定仓库。
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$repo" --title "$tag" --generate-notes --verify-tag \
            || gh release view "$tag" --repo "$repo" >/dev/null
          gh release upload "$tag" "backend-$VERSION-linux-${{ matrix.arch }}.tar.gz" --repo "$repo" --clobber
