name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Alembic upgrade on Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic upgrade head

      - name: Alembic downgrade/upgrade round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Alembic model/schema check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: uv run alembic check

      - name: Pytest (SQLite)
        run: uv run pytest -q

      - name: Validate Docker Compose config
        working-directory: ${{ github.workspace }}/deploy
        run: |
          cp .env.production.example .env
          docker compose config --quiet

  # Docker 生产交付：构建并推送 GHCR；目标机通过 deploy/docker-compose.yml 拉取。
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR 镜像名必须全小写；github.repository 会保留仓库名大小写。
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
