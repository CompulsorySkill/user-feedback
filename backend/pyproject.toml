[project]
name = "backend"
version = "1.0.7"
description = "User feedback system backend"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "boto3>=1.40",
    "fastapi-offline>=1.7.7",
    "fastapi[standard]>=0.162.0",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.uv]
# 官方 PyPI 作为默认源：机器级 uv 镜像配置（如 USTC）会被这里覆盖，
# 避免 CI / 镜像构建依赖第三方镜像而超时。本地可用 UV_INDEX_URL 临时改回镜像。
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
