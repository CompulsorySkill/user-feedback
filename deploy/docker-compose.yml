name: feedback

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: feedback
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rustfs:
    image: ${S3_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    command: ["/data"]
    environment:
      # 容器自身仍用 RustFS 的 RUSTFS_* 变量名，值来自 deploy/.env 的 S3_*。
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/.env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-feedback-backend:local}
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose 内直接用与 postgres 服务相同的密码，避免两处配置漂移。
      DATABASE_URL: postgresql+asyncpg://feedback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/feedback
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-feedback-frontend:local}
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      # 媒体直传 / 读取的路径前缀，必须与 backend 的 S3_BUCKET 一致。
      S3_BUCKET: ${S3_BUCKET:-storage}
      # 子路径部署：如 /feedback（带前导斜杠）；根部署留空。
      BASE_PATH: ${BASE_PATH:-}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
      # 裸 IP HTTPS：在 .env 设 CADDY_LOCAL_CERTS=local_certs；留空走 ACME。
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
  caddy-config:
